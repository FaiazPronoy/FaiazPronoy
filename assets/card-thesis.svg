<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="Undergraduate thesis on predicting antibiotic resistance from bacterial genomes">
<style>
.h{font:800 32px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.6px;fill:#E6EDF3}
.k{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2B84B}
.d{font:400 17px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#E6EDF3}
.f{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2B84B}
.b{font:600 17px ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;fill:#5B6B7B;animation:rd 5s linear infinite}.hot{animation-name:ht}@keyframes rd{0%{fill:#5B6B7B}4%{fill:#E6EDF3}12%,100%{fill:#5B6B7B}}@keyframes ht{0%{fill:#5B6B7B}4%,80%{fill:#F2B84B}100%{fill:#5B6B7B}}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}}
</style>
<rect width="600" height="240" rx="18" fill="#16202B"/>
<text class="h" x="34" y="58">Resistance from genomes</text>
<text class="k" x="34" y="84">Undergraduate thesis, graded A+</text>
<text class="d" x="34" y="122">Predicts resistance to 7 antibiotics</text><text class="d" x="34" y="148">from 6,962 E. coli genomes.</text>
<text class="f" x="34" y="212">PyTorch and XGBoost. Mean PR-AUC 84.9%.</text>
