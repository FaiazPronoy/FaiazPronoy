<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" width="1200" height="176" role="img" aria-label="Education: SSC in Science, GPA 5.00, Willes Little Flower School and College, 2019. HSC in Science, GPA 5.00, National Ideal College, 2021. B.Sc. in CSE, BRAC University, CGPA 3.95 out of 4.00, 136 credits, 2022 to 2026. M.Sc. in ICT, BUET, from October 2026.">
<style>text{text-anchor:middle}.y{font:800 21px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2F81F7}.t{font:700 18px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2328}.d{font:400 15.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636E}
.ln{stroke:#D0D7DE;stroke-width:4;stroke-linecap:round}.go{stroke:#2F81F7;stroke-width:4;stroke-linecap:round;stroke-dasharray:900;animation:go 9s cubic-bezier(.4,0,.2,1) infinite}
@keyframes go{0%{stroke-dashoffset:900}32%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.st{animation:st 9s cubic-bezier(.2,.8,.2,1) infinite}@keyframes st{0%{opacity:.25;transform:translateY(6px)}6%,100%{opacity:1;transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pu 2s ease-out infinite}@keyframes pu{from{transform:scale(1);opacity:.9}to{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.go,.st,.pulse{animation:none}}</style>
