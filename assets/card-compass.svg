<text class="h" x="34" y="58">BRACU Course Compass</text>
<text class="k" x="34" y="84">CSE470, Software Engineering</text>
<text class="d" x="34" y="122">Course reviews, Q&amp;A, a semester</text><text class="d" x="34" y="148">planner and a study desk for BRACU.</text>
