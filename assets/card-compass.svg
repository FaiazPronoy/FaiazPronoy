.f{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#DDF59A}
.needle{animation:sw 6s cubic-bezier(.3,1.4,.5,1) infinite}@keyframes sw{0%{transform:rotate(-70deg)}30%,70%{transform:rotate(40deg)}100%{transform:rotate(-70deg)}}
