<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="BRACU CGPA Analyzer, a CGPA planning tool">
<style>
.h{font:800 32px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.6px;fill:#FFFFFF}
.k{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#C9D8FF}
.d{font:400 17px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#FFFFFF}
.f{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#C9D8FF}
.ring{animation:fill 4.5s cubic-bezier(.4,0,.2,1) infinite alternate}@keyframes fill{0%,10%{stroke-dashoffset:137.2}90%,100%{stroke-dashoffset:39.2}}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}}
</style>
<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#0F1C4D"/><stop offset="1" stop-color="#1E4FD8"/></linearGradient><radialGradient id="rg" cx="1.0" cy="1.05" r=".75"><stop offset="0" stop-color="#FF3355" stop-opacity="0.7"/><stop offset="1" stop-color="#FF3355" stop-opacity="0"/></radialGradient><clipPath id="rr"><rect width="600" height="240" rx="18"/></clipPath></defs><g clip-path="url(#rr)"><rect width="600" height="240" fill="url(#lg)"/><rect width="600" height="240" fill="url(#rg)"/></g>
<text class="h" x="34" y="58">BRACU CGPA Analyzer</text>
<text class="k" x="34" y="84">Personal project</text>
<text class="d" x="34" y="122">Reads a BRACU grade sheet in the</text><text class="d" x="34" y="148">browser and plans repeats and retakes.</text>
<text class="f" x="34" y="212">React, TypeScript, pdf.js. 64 unit tests.</text>
<g transform="translate(500 120)"><circle r="52" fill="none" stroke="#FFFFFF33" stroke-width="12"/><circle class="ring" r="52" fill="none" stroke="#FF5C77" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" transform="rotate(-90)"/><text y="-2" text-anchor="middle" style="font:800 24px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">CGPA</text><text y="20" text-anchor="middle" style="font:600 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#C9D8FF">out of 4.00</text></g>
</svg>
