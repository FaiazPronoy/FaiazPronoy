<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" width="1200" height="384" role="img" aria-label="Student Tutor, Programming Language I (CSE110), Mar 2026 to Sep 2026: 150+ students supported. Selected as 1 of 65 tutors from 200+ applicants. Taught Java directly to 50+ students. Student Tutor, Mathematics I (MAT110), Nov 2024 to May 2025: 250+ students supported. Appointed on CGPA and reappointed. Guided 50+ students directly. Student Mentor, First Year Advising Team, Jan 2024 to Sep 2025: 120+ new students mentored. 3 cohorts, each guided through its first three semesters. Senior Executive, Event Management, BRAC University Computer Club, Sep 2023 to Sep 2026: 2 promotions. Planned and ran club events, then coordinated the team behind them.">
