<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="SafeBook, an encrypted social network built with Django">
<style>
.h{font:800 32px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.6px;fill:#D7E9E2}
.k{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2EE59D}
.d{font:400 17px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#D7E9E2}
.f{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2EE59D}
.plain{animation:p 5s ease-in-out infinite}.ciph{animation:c 5s ease-in-out infinite}@keyframes p{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes c{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}}
</style>
<defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#2EE59D" stroke-opacity=".09"/></pattern><radialGradient id="gl" cx=".12" cy="0" r=".9"><stop offset="0" stop-color="#2EE59D" stop-opacity=".30"/><stop offset="1" stop-color="#2EE59D" stop-opacity="0"/></radialGradient><clipPath id="rr"><rect width="600" height="240" rx="18"/></clipPath></defs><g clip-path="url(#rr)"><rect width="600" height="240" fill="#070B10"/><rect width="600" height="240" fill="url(#gl)"/><rect width="600" height="240" fill="url(#grid)"/><rect width="600" height="4" fill="#2EE59D"/></g><rect x=".75" y=".75" width="598.5" height="238.5" rx="17.5" fill="none" stroke="#2EE59D" stroke-opacity=".35" stroke-width="1.5"/>
<text class="h" x="34" y="58">SafeBook</text>
<text class="k" x="34" y="84">CSE447, Cryptography and Cryptanalysis</text>
<text class="d" x="34" y="122">A social network where the server</text><text class="d" x="34" y="148">cannot read friends-only posts.</text>
<text class="f" x="34" y="212">Django, AES-GCM, RSA-OAEP. 143 tests.</text>
<g transform="translate(408 86)"><rect width="164" height="78" rx="10" fill="#0D141C" stroke="#2EE59D" stroke-opacity=".4"/><g class="plain"><text x="14" y="30" style="font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8BA39B">a friend reads</text><text x="14" y="56" style="font:500 17px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#D7E9E2">see you at five</text></g><g class="ciph"><text x="14" y="30" style="font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8BA39B">the server stores</text><text x="14" y="56" style="font:500 15px ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;fill:#2EE59D">9f3a 51c0 e27b</text></g></g>
</svg>
